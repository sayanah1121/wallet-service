server:
  port: 8080

spring:
  application:
    name: wallet
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:wallet}
    username: ${POSTGRES_USER:wallet}
    password: ${POSTGRES_PASSWORD:wallet_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info


app:
  jwt:
    secret: "${JWT_SECRET:b3f513d677fcca7c655ff0602f3ee37eb018a39495dc2dbebfc345eb911e6d85}"
    access-token-minutes: 15
    refresh-token-days: 7
