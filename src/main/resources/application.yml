server:
  port: 8080

spring:
  application:
    name: wallet
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:wallet}
    username: ${POSTGRES_USER:wallet}
    password: ${POSTGRES_PASSWORD:wallet_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info
